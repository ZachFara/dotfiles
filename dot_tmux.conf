# Setting the base index to 1 for the panes
set -g base-index 1
# Move the status bar to the top
set-option -g status-position top

# Enabling vi keybindings
set -g mode-keys vi

# Here I am trying to fix the tmux copying and pasting issue
if-shell 'command -v reattach-to-user-namespace >/dev/null 2>&1' \
  'set -g default-command "reattach-to-user-namespace -l $SHELL"' \
  'set -g default-command "$SHELL"'
set-option -g default-shell /bin/zsh

## Setting TMUX specific shortcuts
unbind C-b  # Unbind the default leader key (Ctrl+b)
set-option -g prefix C-s  # Set Ctrl+s as the leader key
bind C-s send-prefix  # Rebind Ctrl+s to send the prefix if pressed twice

# Setting some shortcuts with TMUX
bind n send-keys "nv ." C-m

#Splitting new tmux sessions with 
unbind h
bind h split-window -h -c "#{pane_current_path}"

unbind v
bind v split-window -v -c "#{pane_current_path}"

# Smart new windows

unbind c
bind c new-window -c "#{pane_current_path}"

unbind %
bind % split-window -h -c "#{pane_current_path}"
unbind '"'
bind '"' split-window -v -c "#{pane_current_path}"


# Commands for resizing panes with Ctrl + Alt + hjkl
bind -n C-M-h resize-pane -L 5   # Resize pane left
bind -n C-M-j resize-pane -D 5   # Resize pane down
bind -n C-M-k resize-pane -U 5   # Resize pane up
bind -n C-M-l resize-pane -R 5   # Resize pane right

# Switch to next/previous window with Ctrl+Alt+n/p
bind -n C-M-n next-window
bind -n C-M-p previous-window

# Session killer: fuzzy kill sessions (prefix + k)
bind k display-popup -E "$HOME/Development/active/computer_bash_scripts/tmux_scripts/session_killer.sh"

# Sessionizer: fuzzy jump to a project session (prefix + f)
bind f display-popup -E "$HOME/Development/active/computer_bash_scripts/tmux_scripts/sessionizer.sh"

# recon: Claude Code agent dashboard, sorted by most recent activity (prefix + a)
bind a display-popup -E -w 80% -h 60% "$HOME/.cargo/bin/recon"

# Runner pane helpers (prefix Ctrl+s): Enter runs @run_cmd in a 25% bottom pane; Tab edits @run_cmd
bind Enter run-shell -b '$HOME/.config/tmux-runner.sh run'
bind Tab run-shell '$HOME/.config/tmux-runner.sh prompt'

## TPM Portion
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'odedlaz/tmux-onedark-theme'
set -g @onedark_widgets ""  # Remove all extra widgets
set -g @onedark_time_format ""  # Ensure time is removed
set -g @onedark_date_format ""  # Ensure date is removed

# tmux-power-zoom: zoom pane to separate window and back
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @power_zoom_trigger 'H'  # Use Ctrl+s then H to toggle power zoom

# vim-tmux-navigator: navigate panes with Ctrl+hjkl
set -g @plugin 'christoomey/vim-tmux-navigator'



# Some commands for saving and restoring
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

run '~/.tmux/plugins/tpm/tpm'
# >>> curia >>>
source-file '/Users/user1/.config/curia/curia.tmux'
# <<< curia <<<

# Curia overrides: keep this after the curia block. Curia's snippet replaces the
# onedark window tabs with plain text and takes prefix + a; this restores the
# onedark tabs (with curia's red marker) and gives prefix + a back to recon.
set -g window-status-format '#[fg=#282c34,bg=#282c34,nobold,nounderscore,noitalics]#[fg=#aab2bf,bg=#282c34] #{?#{==:#{@curia_marker},red},#[fg=red]● #[fg=#aab2bf],}#I  #W #[fg=#282c34,bg=#282c34,nobold,nounderscore,noitalics]'
set -g window-status-current-format '#[fg=#282c34,bg=#3e4452,nobold,nounderscore,noitalics]#[fg=#aab2bf,bg=#3e4452,nobold] #{?#{==:#{@curia_marker},red},#[fg=red]● #[fg=#aab2bf],}#I  #W #[fg=#3e4452,bg=#282c34,nobold,nounderscore,noitalics]'
bind a display-popup -E -w 80% -h 60% "$HOME/.cargo/bin/recon"
bind u display-popup -E -w 90% -h 80% "$HOME/go/bin/curia ui"
